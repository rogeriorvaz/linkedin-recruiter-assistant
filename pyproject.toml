[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-recruiter-assistant"
version = "0.3.0"
description = "A browser-assisted tool for researching relevant technology recruiters on LinkedIn."
requires-python = ">=3.11"
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
linkedin-recruiter-assistant = "linkedin_recruiter_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
